# TEMPLATE -- not yet functional. No Coolify server/production environment
# exists (see PROJECT_STATUS.md BLK-002). This workflow is intentionally
# written to skip (not fail) until COOLIFY_PRODUCTION_WEBHOOK_TOKEN is
# configured as a repository secret, so merges to main don't show a red X
# for infrastructure that doesn't exist yet.
#
# The "production" environment referenced below must be created under
# Settings -> Environments with required reviewers configured -- that is
# what provides the manual-approval gate ROADMAP.md Phase 2 asks for.
name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check production deploy is configured
        id: check
        run: |
          if [ -z "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping production deploy -- COOLIFY_PRODUCTION_WEBHOOK_TOKEN is not set. See BLK-002 in PROJECT_STATUS.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Coolify production deploy
        if: steps.check.outputs.configured == 'true'
        run: |
          curl -f -X POST "${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_TOKEN }}"

      - name: Smoke test production
        if: steps.check.outputs.configured == 'true'
        run: |
          curl -f "${{ vars.PRODUCTION_URL }}/health"
