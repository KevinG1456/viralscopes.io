name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly re-scan, independent of any push, in case a new advisory is
    # disclosed for a dependency already in the lockfile.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit (production-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production-aware audit policy
        run: node .github/scripts/check-audit.mjs

  dependency-review:
    name: Dependency Review (PR diff only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # CodeQL is deliberately not included here. Verified via a real run
  # (2026-07-26): the analysis step itself succeeds (scanned all
  # TypeScript/JavaScript files, generated SARIF), but the results-upload
  # step fails with "Resource not accessible by integration" — GitHub's
  # own annotation on that run states plainly: "Code scanning is not
  # enabled for this repository." This is the same GitHub Advanced
  # Security gating on private repos under the current plan that already
  # blocked secret scanning and classic branch protection (see
  # PROJECT_STATUS.md BLK-001). A job that can never succeed on this plan
  # would just be a permanently-red, unactionable check — revisit if the
  # plan changes (GitHub Pro/Team, or the repo goes public).
