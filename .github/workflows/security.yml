name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly re-scan, independent of any push, in case a new advisory is
    # disclosed for a dependency already in the lockfile.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Phase 10 Milestone 4: explicit least-privilege default for every job
# that doesn't declare its own (matches the repo's actual
# default_workflow_permissions=read setting, verified via the API). The
# `codeql` job below still declares its own broader
# `security-events: write` -- job-level permissions override this
# workflow-level default, so that job is unaffected by this addition.
permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit (production-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production-aware audit policy
        run: node .github/scripts/check-audit.mjs

  # Both dependency-review and codeql require GitHub Advanced Security.
  # First tested while the repo was private (2026-07-26): both failed
  # immediately -- "Dependency review is not supported on this
  # repository" and "Code scanning is not enabled for this repository" --
  # confirming Advanced Security isn't available for private repos on
  # this plan (same gating that blocked secret scanning and branch
  # protection, see PROJECT_STATUS.md BLK-001). Re-tested after the repo
  # was made public: both pass, since Advanced Security is free on
  # public repos.
  dependency-review:
    name: Dependency Review (PR diff only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (v5 is a movable branch, not a fixed tag -- confirmed via the API)
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
