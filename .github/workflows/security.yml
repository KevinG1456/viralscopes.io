name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly re-scan, independent of any push, in case a new advisory is
    # disclosed for a dependency already in the lockfile.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit (production-aware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production-aware audit policy
        run: node .github/scripts/check-audit.mjs

  # Both dependency-review and codeql require GitHub Advanced Security.
  # First tested while the repo was private (2026-07-26): both failed
  # immediately -- "Dependency review is not supported on this
  # repository" and "Code scanning is not enabled for this repository" --
  # confirming Advanced Security isn't available for private repos on
  # this plan (same gating that blocked secret scanning and branch
  # protection, see PROJECT_STATUS.md BLK-001). Re-tested after the repo
  # was made public: both pass, since Advanced Security is free on
  # public repos.
  dependency-review:
    name: Dependency Review (PR diff only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
