# Local development infrastructure only.
#
# apps/web and apps/api run natively on the host (`npm run dev`) for fast
# hot reload — see README.md §6. This file starts everything they and the
# workflow engine depend on: Postgres, Redis, n8n, MinIO (local S3), and the
# Prometheus/Grafana/Loki monitoring stack.
#
# Postgres is a plain postgres:17-alpine container, not the Supabase CLI
# stack. This project authenticates with its own JWT/OAuth system (see
# Security_Architecture.md §5), not Supabase Auth, so the app never touches
# Supabase's GoTrue/Storage/Realtime services — only Postgres itself, which
# is what production (Supabase-hosted Postgres) is too. See PROJECT_STATUS.md
# DEC-012 for the full reasoning; this supersedes an earlier comment here
# that assumed the Supabase CLI would be used.
#
# Usage: docker compose -f docker-compose.dev.yml up -d

networks:
  viralscopes:
    driver: bridge

volumes:
  postgres-data:
  n8n-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-viralscopes}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - viralscopes
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - viralscopes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    # No volume: Stage 1 dev Redis is intentionally non-persistent
    # (see INFRASTRUCTURE_GROWTH_PLAN.md §8.3) — cache misses on restart
    # are acceptable at this stage.

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-encryption-key-change-me}
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      # ROADMAP.md's "Configure Redis queue (BullMQ) integration" is met by
      # apps/api's OWN BullMQ producer/worker (lib/queue.ts), which is
      # entirely independent of n8n's internal EXECUTIONS_MODE setting --
      # that queue only distributes n8n's OWN executions across separate
      # `n8n worker` processes, which don't exist here (single instance).
      # Tried queue mode directly; without a worker process consuming it,
      # every execution enqueues and hangs forever (confirmed live: a
      # webhook call never returned). n8n's own default "regular" mode
      # (this app's tier) executes in-process and needs no separate worker
      # -- also the only mode n8n itself calls officially supported with
      # its default SQLite backing (queue mode logs "Scaling mode is not
      # officially supported with sqlite" on every boot). A dedicated
      # `n8n worker` service + Postgres-backed n8n is real, deferred
      # infrastructure work (TD-021), not a Phase 6 foundation requirement.
      # Shared secret n8n workflows attach as a header (see infra/n8n-workflows/)
      # when calling apps/api's /api/v1/internal/* routes -- validated by
      # requireServiceToken (apps/api/src/middleware/require-service-token.ts).
      # Never hard-coded: read from .env, same convention as every other
      # secret in this file.
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN:-dev-only-service-token-change-me}
      API_INTERNAL_URL: http://host.docker.internal:3001
      # n8n blocks $env access from node expressions by default (confirmed
      # live: "access to env vars denied" for both the service-token check
      # and the heartbeat workflow's header injection). Safe to relax here
      # -- this is a single-tenant, self-hosted instance we control, not a
      # multi-tenant n8n cloud deployment where this restriction matters
      # for isolating untrusted workflow authors from host secrets.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      # Phase 7's prompt-test workflow (infra/n8n-workflows/prompt-test.json)
      # reads these to call the real AI provider. Not set anywhere in this
      # environment yet (see TD-023 in PROJECT_STATUS.md) -- defaulting to
      # empty rather than omitting the var so the workflow fails with a
      # clear provider auth error instead of an undefined-variable error
      # once keys are added here, no compose change is needed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      # host.docker.internal is built into Docker Desktop (Windows/Mac) but
      # needs this explicit mapping on native Linux Docker -- apps/api runs
      # natively on the host (see this file's header comment), not as a
      # container, so n8n reaches it via the host gateway either way.
      - 'host.docker.internal:host-gateway'
    ports:
      - '5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - viralscopes
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5678/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    networks:
      - viralscopes
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - viralscopes

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3002:3000'
    networks:
      - viralscopes
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    networks:
      - viralscopes
