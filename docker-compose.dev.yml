# Local development infrastructure only.
#
# apps/web and apps/api run natively on the host (`npm run dev`) for fast
# hot reload — see README.md §6. This file starts everything they and the
# workflow engine depend on: Postgres, Redis, n8n, MinIO (local S3), and the
# Prometheus/Grafana/Loki monitoring stack.
#
# Postgres is a plain postgres:17-alpine container, not the Supabase CLI
# stack. This project authenticates with its own JWT/OAuth system (see
# Security_Architecture.md §5), not Supabase Auth, so the app never touches
# Supabase's GoTrue/Storage/Realtime services — only Postgres itself, which
# is what production (Supabase-hosted Postgres) is too. See PROJECT_STATUS.md
# DEC-012 for the full reasoning; this supersedes an earlier comment here
# that assumed the Supabase CLI would be used.
#
# Usage: docker compose -f docker-compose.dev.yml up -d

networks:
  viralscopes:
    driver: bridge

volumes:
  postgres-data:
  n8n-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-viralscopes}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - viralscopes
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - viralscopes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    # No volume: Stage 1 dev Redis is intentionally non-persistent
    # (see INFRASTRUCTURE_GROWTH_PLAN.md §8.3) — cache misses on restart
    # are acceptable at this stage.

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-encryption-key-change-me}
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
    ports:
      - '5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - viralscopes

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    networks:
      - viralscopes
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - viralscopes

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3002:3000'
    networks:
      - viralscopes
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    networks:
      - viralscopes
