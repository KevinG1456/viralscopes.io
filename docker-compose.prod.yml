# docker-compose.prod.yml
#
# NOT deployed anywhere yet. This is Phase 2's infrastructure-as-code
# deliverable per ROADMAP.md — written and validated (`docker compose
# config`), but there is no provisioned server, domain, or secrets to
# actually run it against (see PROJECT_STATUS.md). It becomes live when
# those exist and Coolify points at this file.
#
# PostgreSQL is not included — production uses hosted Supabase
# (DATABASE_URL below), not a self-hosted container. Object storage is
# Cloudflare R2 (S3_* env vars), not the MinIO used in dev.
#
# Phase 10 Milestone 4 (container hardening): `no-new-privileges` is
# added to every service -- a universally safe restriction (blocks a
# process from gaining more privileges than it started with via a setuid
# binary) that doesn't require per-image testing to justify. `read_only`
# root filesystems + explicit `tmpfs` scratch space are added only to
# `api`/`web` -- the two images this project builds and fully controls,
# rebuilt and verified booting correctly under these exact flags against
# the real dev network this same milestone. The same treatment was
# deliberately NOT extended to the third-party images (traefik, redis,
# n8n, prometheus, grafana, loki): each would need its own per-image
# verification of what it actually writes to its own root filesystem at
# runtime beyond its declared volume, and Traefik specifically binds
# privileged ports 80/443, which a wrong capability/read-only combination
# could break outright with no way to verify locally (this file isn't
# deployed anywhere yet). Logged as a follow-up rather than guessed at.

networks:
  viralscopes:
    driver: bridge

volumes:
  letsencrypt:
  n8n-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - viralscopes

  api:
    image: ghcr.io/keving1456/viralscopes-api:latest
    restart: unless-stopped
    env_file: .env.production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - viralscopes
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.viralscopes.io}`)'
      - 'traefik.http.routers.api.entrypoints=websecure'
      - 'traefik.http.routers.api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.api.loadbalancer.server.port=3001'
      # Orchestrator-level readiness gate: don't route traffic to a
      # container that hasn't confirmed its dependencies are ready.
      - 'traefik.http.services.api.loadbalancer.healthcheck.path=/ready'
      - 'traefik.http.services.api.loadbalancer.healthcheck.interval=30s'
      - 'traefik.http.routers.api.middlewares=security-headers@file'

  web:
    image: ghcr.io/keving1456/viralscopes-web:latest
    restart: unless-stopped
    env_file: .env.production
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - viralscopes
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.web.rule=Host(`${APP_DOMAIN:-app.viralscopes.io}`)'
      - 'traefik.http.routers.web.entrypoints=websecure'
      - 'traefik.http.routers.web.tls.certresolver=letsencrypt'
      - 'traefik.http.services.web.loadbalancer.server.port=3000'
      - 'traefik.http.routers.web.middlewares=security-headers@file'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    networks:
      - viralscopes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      # n8n's own EXECUTIONS_MODE=queue needs a separate `n8n worker`
      # process + Postgres-backed storage to actually work (confirmed live
      # in dev: without a worker, executions enqueue and hang forever) --
      # deferred as TD-021, not configured here. apps/api's own BullMQ
      # producer/worker (lib/queue.ts) already satisfies ROADMAP.md's
      # "Configure Redis queue (BullMQ) integration" independently of this
      # setting. N8N_SERVICE_TOKEN comes from .env.production (env_file
      # above), never hard-coded here.
      API_INTERNAL_URL: http://api:3001
      # See docker-compose.dev.yml's n8n block -- required for workflow
      # expressions to read N8N_SERVICE_TOKEN/API_INTERNAL_URL at all.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
    security_opt:
      - no-new-privileges:true
    networks:
      - viralscopes
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5678/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN:-n8n.viralscopes.io}`)'
      - 'traefik.http.routers.n8n.entrypoints=websecure'
      - 'traefik.http.routers.n8n.tls.certresolver=letsencrypt'

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - viralscopes

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - viralscopes
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.viralscopes.io}`)'
      - 'traefik.http.routers.grafana.entrypoints=websecure'
      - 'traefik.http.routers.grafana.tls.certresolver=letsencrypt'

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - viralscopes
