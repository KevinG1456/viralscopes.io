# infra/monitoring/loki/loki.yml
#
# Monitoring_and_Operations.md §3 documents an older Loki config schema
# (boltdb-shipper + shared_store) that no longer matches the config schema
# of the current `grafana/loki:latest` image (verified against Loki 3.7.4 —
# `shared_store` was removed from boltdb.IndexCfg). This uses the current
# single-binary config shape (common storage block + tsdb schema v13).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30 days, per Stage 1 (INFRASTRUCTURE_GROWTH_PLAN.md §14.4)
