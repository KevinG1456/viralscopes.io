# TEMPLATE -- part of docker-compose.prod.yml, unverified (see BLK-002).
# Security headers per PROJECT_RULES.md 4.4.
http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: 'strict-origin-when-cross-origin'
        # Baseline CSP for Phase 2 -- 'unsafe-inline' on script/style is required
        # by Next.js's default (non-nonce) hydration setup. Tighten this (nonce-
        # based script-src, drop unsafe-inline) once Phase 8 builds the real
        # frontend and Phase 10 does formal security hardening.
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:;
          font-src 'self' data:;
          connect-src 'self';
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self'
        customResponseHeaders:
          Permissions-Policy: 'geolocation=(), camera=(), microphone=()'

    # Blocks every external request -- used for the /metrics router below.
    # Prometheus never goes through Traefik: it scrapes api:3001/metrics
    # directly over the internal Docker network (see
    # infra/monitoring/prometheus/prometheus.yml), so nothing legitimate ever
    # needs external access to this path.
    deny-external:
      ipAllowList:
        sourceRange:
          - '127.0.0.1/32'
