# infra/traefik/dynamic/middlewares.yml — edge-level security headers
#
# Transport-level headers only (HSTS, frame options). Content-Security-Policy
# and the rest of the application-level header set (Security_Architecture.md
# §14) are set by Helmet.js in the API itself — that's Phase 5 scope, once
# the API has real routes to protect.

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: 'strict-origin-when-cross-origin'

# Phase 10 Milestone 4: an HTTP->HTTPS `redirect-to-https` middleware used
# to live here, written for Phase 2 but never referenced by any router
# (confirmed dead code during Milestone 1's review). Replaced with an
# entrypoint-level redirect in ../traefik.yml's `web` entrypoint instead,
# which covers every request on :80 unconditionally -- a per-router
# middleware would need every current and future service to remember to
# attach it, and one already hadn't.
