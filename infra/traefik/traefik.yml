# TEMPLATE -- not yet verifiable. No real domain or production server
# exists yet (see PROJECT_STATUS.md BLK-002). This is the target Traefik
# static configuration for docker-compose.prod.yml; the Let's Encrypt
# resolver requires a real, publicly-resolvable domain to obtain a
# certificate, which cannot be tested in this environment.

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'

certificatesResolvers:
  letsencrypt:
    acme:
      email: '${ACME_EMAIL}'
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
